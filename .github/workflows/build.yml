# Tests and builds installers on Windows, macOS and Linux, and publishes them as a GitHub
# Release when a version tag (v*) is pushed. Each OS tests and packages in one job, so a slow
# runner queue on one OS doesn't hold up the others.
name: Build

on:
  push:
    branches: [main, 'MF/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases

env:
  NODE_VERSION: 24
  # The model download uses the GitHub API, which rate-limits unauthenticated calls per IP.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Don't download onnxruntime's optional CUDA libraries on Linux: they add ~500 MB to the
  # installers and only work with NVIDIA's CUDA toolkit installed. Linux builds use the CPU.
  npm_config_onnxruntime_node_install: skip

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            artifacts: dist/*.exe
          - name: macOS
            os: macos-latest # Apple Silicon; onnxruntime-node has no Intel macOS binaries
            target: --mac
            artifacts: dist/*.dmg
          - name: Linux
            os: ubuntu-latest
            target: --linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # npm may skip install scripts, so download and verify the model explicitly.
      - run: node scripts/fetch-model.js
      - run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # no signing certificates; macOS gets an ad-hoc signature
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBlur-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
