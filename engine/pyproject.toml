[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenblur-engine"
version = "0.1.0"
description = "Local-only detection sidecar for ScreenBlur"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13",
  "pillow>=10.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20"]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
screenblur-engine = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The public scheduler API intentionally accepts a `timeout` keyword.
"app/scheduler.py" = ["ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
